[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-xai-paper"
version = "0.2.3"
description = "Reproducible LOB-XAI paper code: counterfactual faithfulness, branch decomposition, and branch-local pooling"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "statsmodels>=0.14",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["lob_xai*", "models*"]

[tool.setuptools.package-data]
lob_xai_viz = ["reference/*.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
